name: Clean Old Docker Image

on:
  workflow_dispatch:

jobs:
  cleanup-old-images:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      deployments: write
      statuses: write 
      
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Purge untagged images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          keep-n-untagged: 0 
          dry-run: false